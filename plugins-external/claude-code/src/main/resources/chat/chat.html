<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
:root { /*THEME*/ }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: var(--size)/1.5 var(--font); }
body { display: flex; flex-direction: column; }
#log { flex: 1; overflow-y: auto; padding: 12px 16px; }
#empty { margin: 20vh auto 0; text-align: center; opacity: 0.55; }
.msg { margin: 10px 0; overflow-wrap: anywhere; }
.msg > :first-child { margin-top: 0; } .msg > :last-child { margin-bottom: 0; }
.user { margin-left: 15%; padding: 8px 12px; border-radius: 10px; background: color-mix(in srgb, var(--fg) 8%, var(--bg)); white-space: pre-wrap; }
.user img, .thumb img { max-height: 120px; max-width: 200px; border-radius: 6px; display: block; margin-bottom: 4px; }
.tool, .perm, .note { margin: 6px 0; padding: 6px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fg) 15%, var(--bg)); font-size: 0.92em; }
.tool { padding: 2px 8px; }
.tool .row > summary { list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 1; padding: 2px 0; }
.tool .row > summary::-webkit-details-marker { display: none; }
.tool .row > summary::after { content: " ›"; opacity: 0.5; } .tool .row[open] > summary::after { content: " ⌄"; }
.tool .name { font-weight: 600; }
.tool .name::before { content: "◌ "; opacity: 0.6; }
.tool.done .name::before { content: "✓ "; color: #3fa25b; opacity: 1; }
.tool.failed .name::before { content: "✗ "; color: #d9534f; opacity: 1; }
.tool .sum { opacity: 0.75; font-family: var(--mono); font-size: 0.92em; }
.tool .res pre { max-height: 300px; overflow: auto; } .empty-res { opacity: 0.6; padding: 2px 0 4px; }
.sub { margin: 4px 0; padding-left: 8px; border-left: 2px solid color-mix(in srgb, var(--fg) 15%, var(--bg)); }
.link, a { color: #3d8bfd; cursor: pointer; text-decoration: none; }
.perm { border-color: #e0a030; }
.perm .q { margin: 8px 0 4px; font-weight: 600; } .perm .hdr { font-size: 0.8em; opacity: 0.7; text-transform: uppercase; }
.perm .opt { display: block; margin: 3px 0; cursor: pointer; } .perm .opt small { opacity: 0.7; }
.perm input[type=text] { width: 100%; margin-top: 4px; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid color-mix(in srgb, var(--fg) 20%, var(--bg)); border-radius: 4px; padding: 2px 6px; }
.btns { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
.note { opacity: 0.65; border: none; padding: 1px 8px; margin: 2px 0; } .divider { text-align: center; opacity: 0.6; font-size: 0.85em; margin: 12px 0; }
.err { margin: 8px 0; padding: 6px 10px; border-radius: 8px; color: #d9534f; background: color-mix(in srgb, #d9534f 10%, var(--bg)); white-space: pre-wrap; font-size: 0.92em; }
pre { position: relative; margin: 6px 0; padding: 8px 10px; border-radius: 6px; overflow-x: auto; background: color-mix(in srgb, var(--fg) 6%, var(--bg)); font: var(--mono-size)/1.45 var(--mono); }
pre .copy { position: absolute; top: 4px; right: 4px; padding: 0 6px; font-size: 0.85em; opacity: 0; }
pre:hover .copy { opacity: 0.8; }
code { font-family: var(--mono); font-size: 0.92em; background: color-mix(in srgb, var(--fg) 8%, var(--bg)); padding: 0 3px; border-radius: 3px; }
pre code { background: none; padding: 0; font-size: inherit; }
h1, h2, h3, h4 { margin: 12px 0 6px; line-height: 1.3; } h1 { font-size: 1.3em; } h2 { font-size: 1.15em; } h3 { font-size: 1.05em; } h4 { font-size: 1em; }
table { border-collapse: collapse; margin: 6px 0; } th, td { border: 1px solid color-mix(in srgb, var(--fg) 20%, var(--bg)); padding: 3px 8px; text-align: left; }
.diff del, .diff ins { display: block; text-decoration: none; }
.diff del { background: color-mix(in srgb, #d9534f 18%, var(--bg)); }
.diff ins { background: color-mix(in srgb, #3fa25b 18%, var(--bg)); }
summary { cursor: pointer; opacity: 0.8; }
#bar { padding: 4px 12px 10px; }
#todos { margin-bottom: 6px; padding: 4px 10px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--fg) 15%, var(--bg)); font-size: 0.9em; }
#todos ul { margin: 2px 0; padding-left: 18px; } #todos .completed { text-decoration: line-through; opacity: 0.6; } #todos .in_progress { font-weight: 600; }
#box { position: relative; padding: 8px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--fg) 20%, var(--bg)); }
#attachments { display: flex; gap: 6px; flex-wrap: wrap; } .thumb { position: relative; } .thumb button { position: absolute; top: 0; right: 0; padding: 0 5px; }
#row { display: flex; gap: 8px; align-items: flex-end; }
#input { flex: 1; resize: none; border: none; outline: none; background: transparent; color: var(--fg); font: inherit; max-height: 40vh; }
#menu { position: absolute; left: 0; right: 0; bottom: 100%; margin-bottom: 4px; max-height: 260px; overflow-y: auto; border-radius: 8px; background: var(--bg); border: 1px solid color-mix(in srgb, var(--fg) 25%, var(--bg)); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
#menu div { padding: 4px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#menu div small { opacity: 0.6; margin-left: 8px; font-size: 0.9em; }
#menu .sel { background: color-mix(in srgb, #3d8bfd 25%, var(--bg)); }
button { font: inherit; padding: 2px 10px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--fg) 25%, var(--bg)); background: color-mix(in srgb, var(--fg) 6%, var(--bg)); color: var(--fg); cursor: pointer; }
button.pick { padding: 1px 6px; font-size: 0.92em; border-color: transparent; background: transparent; opacity: 0.85; }
button.pick::after { content: " ▾"; opacity: 0.6; } button.pick:hover { background: color-mix(in srgb, var(--fg) 8%, var(--bg)); opacity: 1; }
#popup { position: absolute; bottom: 100%; margin-bottom: 4px; min-width: 200px; max-width: 90vw; max-height: 60vh; overflow-y: auto; z-index: 2; border-radius: 8px; background: var(--bg); border: 1px solid color-mix(in srgb, var(--fg) 25%, var(--bg)); box-shadow: 0 4px 16px rgba(0,0,0,0.2); padding: 4px 0; }
#popup div { padding: 4px 12px 4px 6px; cursor: pointer; white-space: nowrap; }
#popup .check { display: inline-block; width: 16px; } #popup small { display: block; margin-left: 16px; opacity: 0.6; white-space: normal; }
#popup .sel { background: color-mix(in srgb, #3d8bfd 25%, var(--bg)); }
button.primary { background: #3d8bfd; border-color: #3d8bfd; color: #fff; }
#controls { position: relative; display: flex; gap: 4px; align-items: center; padding: 4px 2px 0; font-size: 0.85em; }
#controls .spacer { flex: 1; } #ctx, #where { opacity: 0.6; white-space: nowrap; }
#where:not(:empty)::before { content: "· "; }
</style>
<script>/*IDE*/</script>
</head>
<body>
<div id="log"><div id="empty">Ask Claude to write, explain or change code in this project.<br>Type / for commands, @ to mention a file, paste images.</div></div>
<div id="bar">
  <div id="todos" hidden></div>
  <div id="box">
    <div id="menu" hidden role="listbox"></div>
    <div id="attachments"></div>
    <div id="row">
      <textarea id="input" rows="1" placeholder="Ask Claude… (Enter to send, Shift+Enter for a new line)" aria-label="Message"></textarea>
      <button id="send" class="primary">Send</button>
    </div>
  </div>
  <div id="controls">
    <div id="popup" hidden role="listbox"></div>
    <!-- shown once claude says its mode and models -->
    <button id="mode" class="pick" aria-haspopup="listbox" title="Permission mode" hidden></button>
    <button id="model" class="pick" aria-haspopup="listbox" title="Model" hidden></button>
    <span class="spacer"></span>
    <span id="ctx" title="Context window used"></span>
    <span id="where"></span>
  </div>
</div>
<script>/*SCRIPT*/</script>
</body>
</html>
